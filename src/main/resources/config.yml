messages:
  # Hex colors, in quotes (YAML treats an unquoted # as a comment)!
  success_color: '#24d169'
  highlight_color: '#2a92c9'

teleport:
  invulnerability_seconds: 4
  request_timeout_seconds: 120
  max_pending_requests: 5
  back_on_death: true
  random_min_range: 0
  random_max_range: 10000
  random_max_attempts: 8
  random_cooldown_seconds: 30
  random_excluded_biomes:
    - cold_ocean
    - deep_cold_ocean
    - deep_frozen_ocean
    - deep_lukewarm_ocean
    - deep_ocean
    - frozen_ocean
    - frozen_river
    - lukewarm_ocean
    - ocean
    - river
    - warm_ocean

homes:
  max_per_player: 3